name: Pinned Security Scan
description: Run sha256-verified gitleaks, opengrep, bandit, osv-scanner and trivy config, and fail on findings.
author: ianchov
branding:
  icon: shield
  color: green

inputs:
  rule-packs:
    description: >-
      opengrep-rules directories to load, space or newline separated. Globs such as javascript/*/security work.
      Empty uses the default set: Python (lang, django, requests, jwt, cryptography, jinja2), GitHub Actions,
      docker-compose, bash, JSON, JavaScript, Go, Rust and HTML security rules.
    default: ""
  exclude:
    description: >-
      Extra paths for opengrep, bandit, osv-scanner and trivy to skip, one per line, for example "app/staticfiles".
      .venv and test files are always skipped.
    default: ""
  pr-comment:
    description: >-
      "true" posts the findings as one pull request comment, with the place, the reason and the change for each,
      and updates that comment on later runs. Needs the pull-requests: write permission. A clean scan only
      updates an earlier comment. A comment that cannot be posted is a warning, not a failure.
    default: "false"
  github-token:
    description: Token for the pull request comment. The default is the workflow token.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        # gitleaks scans the full git history, on pull requests too.
        fetch-depth: 0
        persist-credentials: false
    - shell: bash
      env:
        RULE_PACKS: ${{ inputs.rule-packs }}
        SCAN_EXCLUDE: ${{ inputs.exclude }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/security-scan.py"
