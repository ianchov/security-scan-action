[project]
name = "security-scan-action"
version = "0"
description = "Tests for the security scan action. The action itself runs on the standard library only."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
src = ["scripts", "tests"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108", "S603", "S607"]
