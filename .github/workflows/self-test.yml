name: Self test
# Runs the action on this repository on both architectures, so a version bump with stale SHA-256
# sums fails here and not in the workflows that use this action. It runs on every PR because it is
# a required check: a path filter would leave PRs that skip it waiting forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # SECURITY_SCAN_E2E runs the real scanners on a repository with planted findings,
      # against a local stand-in for the GitHub API.
      - run: uv run pytest -q
        env:
          SECURITY_SCAN_E2E: "1"

  scan:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
      # This repository has no Python, so the step above skips bandit. Scan a one-file Python
      # repository too, so a bandit-requirements.txt update that breaks the install fails here.
      - name: Scan a Python repository (bandit)
        run: |
          fixture="$RUNNER_TEMP/python-fixture"
          git init -q "$fixture"
          printf 'print("ok")\n' > "$fixture/app.py"
          git -C "$fixture" add app.py
          git -C "$fixture" -c user.name=ci -c user.email=ci@example.invalid commit -qm fixture
          cd "$fixture"
          python3 "$GITHUB_WORKSPACE/scripts/security-scan.py" | tee "$RUNNER_TEMP/scan.log"
          grep -qx 'bandit (Python SAST): passed' "$RUNNER_TEMP/scan.log"
